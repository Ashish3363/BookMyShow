# Backend project file (uv).
# Phase: Step 2 adds dependencies: fastapi, sqlalchemy, asyncpg, alembic,
# pydantic-settings, and dev tools pytest and httpx.

[project]
name = "bookmyshow-backend"
version = "0.1.0"
description = "BookMyShow clone backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.152.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
